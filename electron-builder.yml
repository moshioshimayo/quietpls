# electron-builder configuration for quietpls.
# Signing identity comes from MAC_SIGNING_IDENTITY (or standard electron-builder
# CSC_NAME env); when absent the build falls back to ad-hoc signing — auto-update
# then only works for officially signed releases.
appId: com.quietpls.app
productName: quietpls
afterPack: ./scripts/afterPack.js
asar: true
asarUnpack:
  - volume-processor.js
  # Capture (beta) speaker-label sidecar is run by uv, which can't read app.asar.
  - capture/diarize/**
# Runtime-only allowlist: package.json and production node_modules are always
# included by electron-builder; everything else must be listed here so docs/,
# tests/, scripts/, __mocks__/ and repo configs never ship inside app.asar.
files:
  - "*.js"
  - "!generate-icon.js"
  - "!playwright.config.js"
  - "!vitest.config.js"
  - "*.html"
  - "*.css"
  - "assets/**/*"
  - "!assets/entitlements.mac.plist"
  # Capture (beta): opt-in call capture (lib, windows, MCP server, speaker sidecar).
  - "capture/**/*"
  - "!capture/e2e-fakes.js"
  - "!capture/check-speakers.js"
# Native helper that lists which apps are using the mic (meeting-detector.js).
# Built by scripts/build-native.sh (predist).
extraResources:
  - from: bin/mic-users
    to: mic-users
  # Capture (beta) stereo recorder (native/capture.swift): mic + system-audio tap.
  - from: bin/capture
    to: capture
directories:
  output: dist
publish:
  - provider: github
    owner: moshioshimayo
    repo: quietpls
mac:
  category: public.app-category.utilities
  icon: assets/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: quietpls needs access to your microphone to monitor audio levels in real-time. Monitoring never records or transmits audio. If you turn on Capture (beta), calls you approve are recorded and transcribed on this Mac.
    NSAudioCaptureUsageDescription: Capture (beta) records the other side of calls you approve, so they can be transcribed on this Mac.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
dmg:
  sign: true
  title: quietpls
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
  backgroundColor: "#f0f0f0"
