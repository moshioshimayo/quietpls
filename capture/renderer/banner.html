<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'"
    />
    <link rel="stylesheet" href="../../tokens.css">
    <link rel="stylesheet" href="../../components.css">
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="banner.css" />
    <script defer src="../../glyphs.js"></script>
  </head>
  <body>
    <div class="panel card" role="dialog" aria-labelledby="title" aria-describedby="warn">
      <div class="row">
        <svg class="g" aria-hidden="true"><use href="#g-listen"></use></svg>
        <span class="status rd" id="title"><span id="ask">Record a call in <span id="app">Zoom</span>?</span><span id="cant" hidden>Can’t record this call</span></span>
      </div>
      <p class="warn" id="warn" role="alert" hidden></p>
      <div class="group" id="facts">
        <div class="kv"><span>Audio</span><span>Your mic + available call audio</span></div>
        <div class="kv"><span>Transcript</span><span id="where">Saved to your folder</span></div>
        <div class="kv"><span>Keep audio</span><span id="audio">Deleted after transcript is saved</span></div>
      </div>
      <p class="small" id="private">Only you see this prompt; quietpls doesn’t notify the other people on the call.</p>
      <div class="foot">
        <button class="primary" id="accept">Record this call</button>
        <button id="skip">Skip this call</button>
        <button class="link" id="never">Never for <span id="app2">Zoom</span></button>
      </div>
    </div>
    <script src="common.js"></script>
    <script src="banner.js"></script>
  </body>
</html>
